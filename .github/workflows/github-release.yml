name: Build Ekh-MT76x8 Packages and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sanitized_branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr ' ' '-')"
            echo "RELEASE_TAG=manual-${sanitized_branch}-${{ github.run_number }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          sudo apt update
          PKGS="build-essential clang flex g++ gawk gcc-multilib git gettext \
            file wget xz-utils libelf-dev libzstd-dev libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev swig"

          sudo apt install -y $PKGS

      - name: Configure board ekh-mt76x8
        run: |
          ./scripts/morse_setup.sh -i -b ekh-mt76x8

      - name: Ensure Morse feed is installed
        run: |
          set -euo pipefail
          ./scripts/feeds update morse
          ./scripts/feeds install -f -p morse -a

          if [ ! -d feeds/morse ]; then
            echo "Morse feed source directory missing: feeds/morse"
            exit 1
          fi

          morse_pkg_count="$(find package/feeds/morse -mindepth 1 -maxdepth 1 \( -type d -o -type l \) 2>/dev/null | wc -l | tr -d ' ')"
          if [ "${morse_pkg_count}" = "0" ]; then
            echo "No Morse packages installed yet, installing from Morse feed index"
            ./scripts/feeds list -r morse \
              | awk '$1 != "TARGET:" { print $1 }' \
              | while IFS= read -r pkg; do
                  [ -n "${pkg}" ] || continue
                  ./scripts/feeds install -f -p morse "${pkg}"
                done
          fi

          if [ ! -d package/feeds/morse ]; then
            echo "Morse feed packages were not installed into package/feeds/morse"
            exit 1
          fi

          morse_pkg_count="$(find package/feeds/morse -mindepth 1 -maxdepth 1 \( -type d -o -type l \) | wc -l | tr -d ' ')"
          if [ "${morse_pkg_count}" = "0" ]; then
            echo "Morse feed directory exists but has no package entries"
            exit 1
          fi

      - name: Restore OpenWrt toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
          key: ${{ runner.os }}-ekh-mt76x8-toolchain-${{ hashFiles('.config', 'toolchain/**', 'include/toolchain-build.mk', 'include/version.mk') }}
          restore-keys: |
            ${{ runner.os }}-ekh-mt76x8-toolchain-

      - name: Restore OpenWrt host tools cache
        id: host-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            build_dir/host
            build_dir/hostpkg
          key: ${{ runner.os }}-ekh-mt76x8-hosttools-${{ hashFiles('.config', 'tools/**', 'include/version.mk') }}
          restore-keys: |
            ${{ runner.os }}-ekh-mt76x8-hosttools-

      - name: Prepare build toolchain
        run: |
          make defconfig
          if [ "${{ steps.host-tools-cache.outputs.cache-hit }}" != "true" ]; then
            make -j"$(nproc)" tools/install
          else
            echo "Host tools cache hit: skipping tools/install"
          fi

          if [ "${{ steps.toolchain-cache.outputs.cache-hit }}" != "true" ]; then
            make -j"$(nproc)" toolchain/install
          else
            echo "Toolchain cache hit: skipping toolchain/install"
          fi

      - name: Save OpenWrt host tools cache
        if: always() && steps.host-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            build_dir/host
            build_dir/hostpkg
          key: ${{ steps.host-tools-cache.outputs.cache-primary-key }}

      - name: Save OpenWrt toolchain cache
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Build selected packages
        run: |
          set -euo pipefail
          make -j"$(nproc)" target/linux/compile

          if [ ! -d package/feeds/morse ]; then
            echo "Morse feed directory missing: package/feeds/morse"
            exit 1
          fi

          # Morse feed packages to build (package names under package/feeds/morse).
          # Customize this list as needed.
          morse_build_packages=(
            hostapd_s1g
            wpa_supplicant_s1g
          )

          build_targets=()
          for pkg in "${morse_build_packages[@]}"; do
            pkgdir="package/feeds/morse/${pkg}"
            if [ ! -e "${pkgdir}" ]; then
              echo "Requested Morse package missing: ${pkgdir}"
              exit 1
            fi
            build_targets+=("${pkgdir}/compile")
          done

          if [ "${#build_targets[@]}" -eq 0 ]; then
            echo "No selected Morse package targets to build"
            exit 1
          fi

          echo "Building package targets:"
          printf ' - %s\n' "${build_targets[@]}"

          mkdir -p logs/morse
          : > logs/morse/succeeded.txt
          : > logs/morse/failed.txt

          for target in "${build_targets[@]}"; do
            pkg_name="$(basename "$(dirname "${target}")")"
            log_file="logs/morse/${pkg_name}.log"
            echo "=== Building ${target} ==="

            if make -j1 V=sc "${target}" >"${log_file}" 2>&1; then
              echo "${target}" | tee -a logs/morse/succeeded.txt
            else
              echo "${target}" | tee -a logs/morse/failed.txt
              echo "Build failed for ${target}, skipping and continuing"
              echo "Please re-run make with -j1 V=s or V=sc for a higher verbosity level to see what's going on"
            fi
          done

          succeeded_count="$(wc -l < logs/morse/succeeded.txt | tr -d ' ')"
          failed_count="$(wc -l < logs/morse/failed.txt | tr -d ' ')"

          {
            echo "Morse package build summary"
            echo "Succeeded: ${succeeded_count}"
            echo "Failed: ${failed_count}"
            echo
            echo "Succeeded targets:"
            cat logs/morse/succeeded.txt
            echo
            echo "Failed targets:"
            cat logs/morse/failed.txt
          } | tee logs/morse/summary.txt

          if [ "${succeeded_count}" = "0" ]; then
            echo "No Morse package built successfully"
            exit 1
          fi

          if [ "${failed_count}" != "0" ]; then
            echo "Some Morse packages failed, continuing with successful packages only"
          fi

      - name: Bundle release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Feed and architecture packages (bin/packages/**)
          if [ -d bin/packages ]; then
            tar -C bin -czf release-assets/ekh-mt76x8-bin-packages.tar.gz packages
          fi

          # Target-specific kernel modules and target packages (bin/targets/**/packages)
          target_dir="$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -n1)"
          if [ -n "${target_dir}" ] && [ -d "${target_dir}/packages" ]; then
            tar -C "${target_dir}" -czf release-assets/ekh-mt76x8-target-packages.tar.gz packages
          fi

          if ls release-assets/*.tar.gz >/dev/null 2>&1; then
            (cd release-assets && sha256sum *.tar.gz > sha256sums.txt)
          else
            echo "No package tarballs were created" > release-assets/sha256sums.txt
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ekh-mt76x8-release-assets
          path: release-assets/*

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekh-mt76x8-build-logs
          path: |
            target-linux-compile.log
            package-compile.log
            logs/morse/**
            logs/**

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: true
          files: |
            release-assets/*.tar.gz
            release-assets/sha256sums.txt
