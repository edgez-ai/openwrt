name: Build Ekh-MT76x8 Packages and Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sanitized_branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr ' ' '-')"
            echo "RELEASE_TAG=manual-${sanitized_branch}-${{ github.run_number }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Install build dependencies
        run: |
          sudo apt update
          PKGS="build-essential clang flex g++ gawk gcc-multilib git gettext \
            file wget xz-utils libelf-dev libzstd-dev libncurses5-dev libncursesw5-dev \
            libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev swig"

          sudo apt install -y $PKGS

      - name: Configure board ekh-mt76x8
        run: |
          ./scripts/morse_setup.sh -i -b ekh-mt76x8

      - name: Restore OpenWrt toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
          key: ${{ runner.os }}-ekh-mt76x8-toolchain-${{ hashFiles('.config', 'toolchain/**', 'include/toolchain-build.mk', 'include/version.mk') }}
          restore-keys: |
            ${{ runner.os }}-ekh-mt76x8-toolchain-

      - name: Restore OpenWrt host tools cache
        id: host-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            build_dir/host
            build_dir/hostpkg
          key: ${{ runner.os }}-ekh-mt76x8-hosttools-${{ hashFiles('.config', 'tools/**', 'include/version.mk') }}
          restore-keys: |
            ${{ runner.os }}-ekh-mt76x8-hosttools-

      - name: Prepare build toolchain
        run: |
          make defconfig
          if [ "${{ steps.host-tools-cache.outputs.cache-hit }}" != "true" ]; then
            make -j"$(nproc)" tools/install
          else
            echo "Host tools cache hit: skipping tools/install"
          fi

          if [ "${{ steps.toolchain-cache.outputs.cache-hit }}" != "true" ]; then
            make -j"$(nproc)" toolchain/install
          else
            echo "Toolchain cache hit: skipping toolchain/install"
          fi

      - name: Save OpenWrt host tools cache
        if: always() && steps.host-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/host
            staging_dir/hostpkg
            build_dir/host
            build_dir/hostpkg
          key: ${{ steps.host-tools-cache.outputs.cache-primary-key }}

      - name: Save OpenWrt toolchain cache
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            staging_dir/toolchain-*
            build_dir/toolchain-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Build selected packages
        run: |
          set -e
          if ! make -j"$(nproc)" package/compile; then
            echo "Parallel package build failed, retrying with verbose output"
            make -j1 package/compile V=s 2>&1 | tee package-compile.log
            exit 1
          fi

      - name: Bundle release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Feed and architecture packages (bin/packages/**)
          if [ -d bin/packages ]; then
            tar -C bin -czf release-assets/ekh-mt76x8-bin-packages.tar.gz packages
          fi

          # Target-specific kernel modules and target packages (bin/targets/**/packages)
          target_dir="$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -n1)"
          if [ -n "${target_dir}" ] && [ -d "${target_dir}/packages" ]; then
            tar -C "${target_dir}" -czf release-assets/ekh-mt76x8-target-packages.tar.gz packages
          fi

          (cd release-assets && sha256sum *.tar.gz > sha256sums.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ekh-mt76x8-release-assets
          path: release-assets/*

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ekh-mt76x8-build-logs
          path: |
            package-compile.log
            logs/**

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: true
          files: |
            release-assets/*.tar.gz
            release-assets/sha256sums.txt
